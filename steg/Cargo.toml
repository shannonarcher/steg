[package]
name = "steg"
version = "0.1.0"
edition = "2021"
publish = false
license = "MIT"
description = "Steg: a Model Context Protocol server that exposes the WezTerm multiplexer (windows, tabs, panes, screen contents) to AI agents"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "steg"
path = "src/lib.rs"

[[bin]]
name = "steg"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
codec.workspace = true
config.workspace = true
dirs-next.workspace = true
env-bootstrap.workspace = true
log.workspace = true
mux.workspace = true
portable-pty.workspace = true
serde.workspace = true
serde_json.workspace = true
tempfile.workspace = true
termwiz.workspace = true
termwiz-funcs.workspace = true
wezterm-client.workspace = true
wezterm-gui-subcommands.workspace = true
wezterm-term.workspace = true

# MCP
rmcp = { version = "3.8", features = ["server", "macros", "transport-io"] }
schemars = "1.0"
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "sync", "io-std", "process"] }

[dev-dependencies]
# The tests drive the server through a real MCP client: in-process over a
# duplex pipe, and end-to-end as a child process against a headless
# wezterm-mux-server.
rmcp = { version = "3.8", features = ["client", "transport-child-process"] }
tokio = { workspace = true, features = ["io-util", "fs"] }
